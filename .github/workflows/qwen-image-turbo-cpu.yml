name: qwen-image-turbo-cpu

# Stock (non-uncensored) Qwen-Image 2.1 Turbo: only the fixed Q8_0 quant and the
# fixed 8-step Turbo schedule are published for it, so neither is selectable here.
on:
  workflow_dispatch:
    inputs:
      text_encoder:
        description: Qwen3-VL-8B-Instruct text encoder quant
        type: choice
        default: Q8_0
        options: [Q4_K_M, Q8_0]
      width:
        description: Image width (multiple of 32)
        type: string
        default: '576'
      height:
        description: Image height (multiple of 32)
        type: string
        default: '1024'
      threads:
        description: CPU threads (empty = all vCPUs from nproc)
        type: string
        default: ''
      swap_gb:
        description: Swap size in GB (0 = swap off, so an OOM kill means it does not fit; 0-16)
        type: string
        default: '0'
      mmap:
        description: Pass --mmap (lets the kernel drop the text encoder pages after encoding)
        type: boolean
        default: true
      flash_attn:
        description: Pass --fa
        type: boolean
        default: true
      vae_tiling:
        description: Pass --vae-tiling (cuts VAE decode memory, about 4 GB at 576x1024 otherwise)
        type: boolean
        default: true
      prompt:
        description: "Prompt (public: shown in this public repo's run logs, keep it SFW)"
        type: string
        default: 'Sitting on a white sofa with arms extended wide, resting hands on the backrest, legs crossed at the knee, polished digital illustration of a woman with a slender, elegant feminine build and balanced proportions. She has long, straight auburn hair, a fair complexion, and a captivating facial expression. She is wearing a bright turquoise blue halter-style mini dress with subtle shimmering textures and black fishnet stockings paired with black high-heeled sandals featuring gold stud accents. The artwork features smooth value transitions, believable volume, and high-quality idealization.'
      seed:
        description: Seed (empty = random each run; reuse a run's seed to reproduce it)
        type: string
        default: ''

permissions:
  contents: read

# Separate group from the other image workflows: queue: max keeps every dispatched run waiting (FIFO) instead of cancelling all but the newest.
concurrency:
  group: qwen-image-turbo-cpu
  queue: max

jobs:
  # Maps the quant choices to URLs, checksums and sizes (approximate whole GB, rounded up); the only place they are listed.
  resolve:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    env:
      IN_TEXT_ENCODER: ${{ inputs.text_encoder }}
      DM_BASE: https://huggingface.co/abenzerps/Qwen-Image-2.1-Turbo-Quantized/resolve/main
      LLM_BASE: https://huggingface.co/Qwen/Qwen3-VL-8B-Instruct-GGUF/resolve/main
      # The Turbo repo ships no VAE, so the Turbo workflow reuses the one from the UC repo.
      VAE_BASE: https://huggingface.co/abenzerps/Qwen-Image-2.1-Uncensored-GGUF/resolve/main
    outputs:
      dm_url: ${{ steps.pick.outputs.dm_url }}
      dm_file: ${{ steps.pick.outputs.dm_file }}
      dm_sha: ${{ steps.pick.outputs.dm_sha }}
      dm_gb: ${{ steps.pick.outputs.dm_gb }}
      llm_url: ${{ steps.pick.outputs.llm_url }}
      llm_file: ${{ steps.pick.outputs.llm_file }}
      llm_sha: ${{ steps.pick.outputs.llm_sha }}
      llm_gb: ${{ steps.pick.outputs.llm_gb }}
      vae_url: ${{ steps.pick.outputs.vae_url }}
      vae_file: ${{ steps.pick.outputs.vae_file }}
      vae_sha: ${{ steps.pick.outputs.vae_sha }}
      vae_gb: ${{ steps.pick.outputs.vae_gb }}
    steps:
      - name: Pick models
        id: pick
        run: |
          set -euo pipefail
          dm=qwen-image-2.1-turbo-Q8_0.gguf
          dm_sha=9c2fd9b645811ae5f2b41e60adee832510a23929bc05bd6f8cc48d34a17b079e
          dm_gb=8
          case "$IN_TEXT_ENCODER" in
            Q4_K_M) llm=Qwen3VL-8B-Instruct-Q4_K_M.gguf; llm_sha=67d1659bfe71b89d50b45a4ad1a9e5b997e5bb16ce5da66a6a6167abd569e9e2; llm_gb=5 ;;
            Q8_0)   llm=Qwen3VL-8B-Instruct-Q8_0.gguf;   llm_sha=0d264b3941185d00a74f75c4245521dae088ff1efc90ab8d1754e83f5844adb0; llm_gb=9 ;;
            *) echo "::error::unknown text encoder quant"; exit 1 ;;
          esac
          vae=qwen_image_2.1_vae_bf16.safetensors
          vae_url="$VAE_BASE/vae/$vae"
          vae_sha=bb21f7473051e1ac368515dd3f2e15cd44d7a11748ee8823e1ddca3e4876b7c9
          vae_gb=1
          {
            echo "dm_url=$DM_BASE/$dm"
            echo "dm_file=$dm"
            echo "dm_sha=$dm_sha"
            echo "dm_gb=$dm_gb"
            echo "llm_url=$LLM_BASE/$llm"
            echo "llm_file=$llm"
            echo "llm_sha=$llm_sha"
            echo "llm_gb=$llm_gb"
            echo "vae_url=$vae_url"
            echo "vae_file=$vae"
            echo "vae_sha=$vae_sha"
            echo "vae_gb=$vae_gb"
          } >> "$GITHUB_OUTPUT"

  probe:
    needs: resolve
    # The called upload job deletes the image artifact, so this job must grant actions: write too.
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/sd-cpu-probe.yml
    with:
      name: qwen-image-turbo-cpu
      prompt: ${{ inputs.prompt }}
      dm_url: ${{ needs.resolve.outputs.dm_url }}
      dm_file: ${{ needs.resolve.outputs.dm_file }}
      dm_sha: ${{ needs.resolve.outputs.dm_sha }}
      dm_gb: ${{ needs.resolve.outputs.dm_gb }}
      llm_url: ${{ needs.resolve.outputs.llm_url }}
      llm_file: ${{ needs.resolve.outputs.llm_file }}
      llm_sha: ${{ needs.resolve.outputs.llm_sha }}
      llm_gb: ${{ needs.resolve.outputs.llm_gb }}
      vae_url: ${{ needs.resolve.outputs.vae_url }}
      vae_file: ${{ needs.resolve.outputs.vae_file }}
      vae_sha: ${{ needs.resolve.outputs.vae_sha }}
      vae_gb: ${{ needs.resolve.outputs.vae_gb }}
      width: ${{ inputs.width }}
      height: ${{ inputs.height }}
      steps: '8'
      threads: ${{ inputs.threads }}
      swap_gb: ${{ inputs.swap_gb }}
      cfg_scale: '1.0'
      mmap: ${{ inputs.mmap }}
      flash_attn: ${{ inputs.flash_attn }}
      vae_tiling: ${{ inputs.vae_tiling }}
      labels: Q8_0-${{ inputs.text_encoder }}
      seed: ${{ inputs.seed }}
      # Diffusers' fixed Turbo schedule plus the trailing 0 that sd.cpp requires.
      sigmas: '1,0.978453,0.95418,0.926626,0.89508,0.845148,0.704534,0.414568,0'
    secrets:
      BUCKET_S3_ENDPOINT: ${{ secrets.BUCKET_S3_ENDPOINT }}
      BUCKET_S3_URI: ${{ secrets.BUCKET_S3_URI }}
      BUCKET_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY_ID }}
      BUCKET_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_ACCESS_KEY }}
